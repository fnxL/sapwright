name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - group: linting
            commands: |
              uv run ruff check .
          - group: type-check
            commands: |
              uv run basedpyright
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group ${{ matrix.group }}
      - name: Run ${{ matrix.group }}
        run: ${{ matrix.commands }}
